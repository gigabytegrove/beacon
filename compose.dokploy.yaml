# Beacon — works as standard Docker Compose, including Dokploy Raw Compose.
# Docker fetches the public source and its root Dockerfile at build time.
# All first-run admin configuration is handled in the Beacon web UI.
services:
  beacon:
    build: "https://github.com/gigabytegrove/beacon.git#main"
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - beacon-data:/data
    networks:
      - dokploy-network

volumes:
  beacon-data:
    name: beacon-data

networks:
  dokploy-network:
    external: true
