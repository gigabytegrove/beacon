# Dokploy-managed Beacon — GIT-SOURCED Docker Compose, NOT Raw Compose.
# Dokploy service -> Source -> Git: gigabytegrove/beacon, branch main
# Compose Path: ./compose.dokploy.yaml
# A Raw Compose deployment does not download the Dockerfile and WILL FAIL with
# "failed to read dockerfile: open Dockerfile: no such file or directory".
# GitHub is used only for fetching code; NO GitHub Actions are involved.
services:
  beacon:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Bind to the host's LAN-facing interface only when possible.
      # Use BEACON_BIND_IP=127.0.0.1 for reverse-proxy-only access.
      - "${BEACON_BIND_IP:-0.0.0.0}:${BEACON_PORT:-8765}:8765"
    environment:
      BEACON_DB: /data/beacon.db
      BEACON_ADMIN_USERNAME: ${BEACON_ADMIN_USERNAME:-admin}
      # Optional legacy env-based bootstrap. Leave empty for the interactive wizard.
      BEACON_ADMIN_PASSWORD: ${BEACON_ADMIN_PASSWORD:-}
    volumes:
      - beacon-data:/data
    networks:
      - dokploy-network
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  beacon-data:
    # A stable name across Dokploy compose project redeploys.
    # Do NOT share this name with a second Beacon installation.
    name: beacon-data

networks:
  dokploy-network:
    external: true
