plugins {
    id 'com.android.application'
}

android {
    namespace 'net.gigabytegrove.beacon'
    compileSdk 35

    defaultConfig {
        applicationId 'net.gigabytegrove.beacon'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.8.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        outputFileName = "Beacon-Android-" + android.defaultConfig.versionName + "-" + variant.buildType.name + ".apk"
    }
}
