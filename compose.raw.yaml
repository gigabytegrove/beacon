# Beacon Messenger — Dokploy Docker Compose (public GitHub source)
# One-time installation of native updater; subsequent app-code releases update in Beacon UI.
# Never delete beacon-data: code releases and chat database both persist here.
services:
  beacon:
    build: "https://github.com/gigabytegrove/beacon.git#main"
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      BEACON_DB: /data/beacon.db
      # Native GitHub updates need no deployment-platform credentials.
    volumes:
      - beacon-data:/data
    networks:
      - dokploy-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  beacon-data:
    name: beacon-data

networks:
  dokploy-network:
    external: true
