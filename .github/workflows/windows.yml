name: Beacon Go Windows Client
on:
  push:
    paths:
      - 'clients/desktop-go/**'
      - '.github/workflows/windows.yml'
      - 'scripts/build-desktop-windows.ps1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'clients/desktop-go/**'
      - '.github/workflows/windows.yml'
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: clients/desktop-go/go.mod
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Test Go HTTP client and build native executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "C:\msys64\mingw64\bin;$env:Path"
          $env:CGO_ENABLED = "1"
          ./scripts/build-desktop-windows.ps1
      - name: Check release binary
        shell: pwsh
        run: |
          if (!(Test-Path dist/Beacon-Windows-0.8.0.exe)) { throw "Windows binary not produced" }
          Get-FileHash dist/Beacon-Windows-0.8.0.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: beacon-windows-go-0.8.0
          path: |
            dist/Beacon-Windows-0.8.0.exe
            dist/Beacon-Windows-0.8.0.sha256
          if-no-files-found: error
