name: Beacon CI
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner location (all test/build steps remain mandatory)"
        required: true
        type: choice
        default: github-hosted
        options:
          - github-hosted
          - self-hosted
  push:
  pull_request:
jobs:
  server-and-client:
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' && (vars.BEACON_USE_SELF_HOSTED_RUNNERS == 'true' || (github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted'))) && '["self-hosted","Linux","X64","beacon-linux"]' || '"ubuntu-latest"') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q server tests clients/desktop
      - name: Browser JavaScript syntax
        run: |
          python -c "from pathlib import Path; html=Path('server/static/index.html').read_text(); Path('/tmp/beacon-browser.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/beacon-browser.js
      - name: Linux packaging script syntax
        run: |
          bash -n clients/desktop/linux/install.sh
          bash -n clients/desktop/linux/uninstall.sh
      - name: Integration, security, and documentation tests
        run: python -m pytest -q
      - name: Docker build (required)
        run: |
          docker info
          docker build -t beacon-ci .
