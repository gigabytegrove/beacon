name: Beacon Go Linux Client
on:
  push:
    paths:
      - 'clients/desktop-go/**'
      - 'clients/desktop/linux/**'
      - '.github/workflows/linux.yml'
      - 'scripts/build-desktop-linux.sh'
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner location (all test/build steps remain mandatory)"
        required: true
        type: choice
        default: github-hosted
        options:
          - github-hosted
          - self-hosted
  pull_request:
    paths:
      - 'clients/desktop-go/**'
      - '.github/workflows/linux.yml'
jobs:
  linux:
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' && (vars.BEACON_USE_SELF_HOSTED_RUNNERS == 'true' || (github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted'))) && '["self-hosted","Linux","X64","beacon-linux"]' || '"ubuntu-latest"') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: clients/desktop-go/go.mod
      - name: Native GUI build dependencies (GitHub-hosted only)
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev libxkbcommon-dev
      - name: Verify preinstalled libraries (self-hosted)
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          command -v gcc
          command -v pkg-config
          pkg-config --exists gl x11 xcursor xrandr xi xxf86vm
      - name: Test Go HTTP client and build binary
        run: |
          set -Eeuo pipefail
          bash scripts/build-desktop-linux.sh
      - name: Validate distribution and checksum
        run: |
          test -s dist/Beacon-Linux-0.8.0.tar.gz
          cd dist
          sha256sum -c Beacon-Linux-0.8.0.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: beacon-linux-go-0.8.0
          path: |
            dist/Beacon-Linux-0.8.0.tar.gz
            dist/Beacon-Linux-0.8.0.sha256
          if-no-files-found: error
          retention-days: 7
