name: Beacon Go Linux Client
on:
  push:
    paths:
      - 'clients/desktop-go/**'
      - 'clients/desktop/linux/**'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'clients/desktop-go/**'
      - '.github/workflows/linux.yml'
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: clients/desktop-go/go.mod
      - name: Native GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev libxkbcommon-dev
      - name: Test Go HTTP client and build binary
        run: |
          set -Eeuo pipefail
          cd clients/desktop-go
          go mod tidy
          go test -race ./internal/beacon
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -o ../../beacon ./cmd/beacon
      - name: Assemble self-contained distribution archive
        run: |
          set -Eeuo pipefail
          bash -n clients/desktop/linux/install.sh
          bash -n clients/desktop/linux/uninstall.sh
          mkdir -p dist/Beacon-Linux-0.8.0
          cp beacon dist/Beacon-Linux-0.8.0/beacon
          cp clients/desktop/linux/beacon.desktop clients/desktop/linux/beacon.svg clients/desktop/linux/install.sh clients/desktop/linux/uninstall.sh dist/Beacon-Linux-0.8.0/
          chmod +x dist/Beacon-Linux-0.8.0/beacon dist/Beacon-Linux-0.8.0/install.sh dist/Beacon-Linux-0.8.0/uninstall.sh
          tar -C dist -czf dist/Beacon-Linux-0.8.0.tar.gz Beacon-Linux-0.8.0
          sha256sum dist/Beacon-Linux-0.8.0.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: beacon-linux-go-0.8.0
          path: dist/Beacon-Linux-0.8.0.tar.gz
          if-no-files-found: error
