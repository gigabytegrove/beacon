name: Beacon Android Build
on:
  push:
    paths:
      - 'clients/android/**'
      - '.github/workflows/android.yml'
      - 'scripts/build-android-windows.ps1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'clients/android/**'
      - '.github/workflows/android.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: clients/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: beacon-android-0.7.0
          path: clients/android/app/build/outputs/apk/debug/Beacon-Android-0.7.0-debug.apk
          if-no-files-found: error
